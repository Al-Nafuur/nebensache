<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Nebenkosten</title>
  <meta name="description" content="Betriebskostenabrechnung für Vermieter – funktioniert offline, alle Daten bleiben auf Ihrem Gerät.">
  <meta name="theme-color" content="#1d5b6e">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="kopf nicht-drucken">
    <div class="kopf-zeile">
      <div class="marke"><img src="icons/icon.svg" alt="" width="28" height="28"><span>Nebenkosten</span></div>
      <div id="kopf-wahl" class="kopf-wahl"></div>
    </div>
    <nav id="nav" class="nav" aria-label="Bereiche"></nav>
  </header>
  <button id="update" class="update nicht-drucken" data-a="update" hidden>Neue Version verfügbar – jetzt aktualisieren</button>
  <main id="main"></main>
  <footer class="fuss nicht-drucken">
    <span id="status">Lokal gespeichert</span>
    <span>Ihre Daten bleiben auf diesem Gerät</span>
  </footer>
  <noscript><p style="padding:16px">Diese App benötigt JavaScript.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
